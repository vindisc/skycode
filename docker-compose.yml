# =============================================================================
# ZhikunCode — Docker Compose (Production)
# =============================================================================
# Usage:
#   docker compose up -d          # Start in background
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop and remove
#   docker compose up --build     # Rebuild and start
# =============================================================================

services:
  skycode:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: skycode:latest
    container_name: skycode
    # 默认只绑定本机回环地址。镜像里 ALLOW_PRIVATE_NETWORK=true 时，经端口映射进来的请求一律免鉴权，
    # 绑到 0.0.0.0 等于把一个拥有"完全访问"权限、挂着工作区的 Agent 向整个局域网敞开。
    # 确实需要手机等局域网设备访问时，在 .env 里设 SKYCODE_BIND_ADDRESS=0.0.0.0（并确认所在网络可信）。
    ports:
      - "${SKYCODE_BIND_ADDRESS:-127.0.0.1}:${SKYCODE_PORT:-8080}:8080"
    environment:
      # ---- Required ----
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
      - "JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx1024m --enable-preview}"
      # ---- Multi-Provider LLM (Recommended) ----
      - LLM_PROVIDER_OPENAI_API_KEY=${LLM_PROVIDER_OPENAI_API_KEY:-}
      - LLM_PROVIDER_OPENAI_MODELS=${LLM_PROVIDER_OPENAI_MODELS:-gpt-6-astra}
      - LLM_PROVIDER_DASHSCOPE_API_KEY=${LLM_PROVIDER_DASHSCOPE_API_KEY:-}
      - LLM_PROVIDER_DASHSCOPE_MODELS=${LLM_PROVIDER_DASHSCOPE_MODELS:-qwen3.8-max-0902}
      - LLM_PROVIDER_DASHSCOPE_TOKEN_PLAN_API_KEY=${LLM_PROVIDER_DASHSCOPE_TOKEN_PLAN_API_KEY:-}
      - LLM_PROVIDER_DASHSCOPE_TOKEN_PLAN_MODELS=${LLM_PROVIDER_DASHSCOPE_TOKEN_PLAN_MODELS:-deepseek-v4.1-flash,bailian/glm-5.3,qwen4-max-preview,qwen4-max}
      - LLM_PROVIDER_DEEPSEEK_API_KEY=${LLM_PROVIDER_DEEPSEEK_API_KEY:-}
      # 走 DeepSeek 中转站时这两个必须一起改：只改 BASE_URL 不配前缀白名单，摘要链路会返回 unsupported_summary
      - LLM_PROVIDER_DEEPSEEK_BASE_URL=${LLM_PROVIDER_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - SKYCODE_SUMMARY_DEEPSEEK_RELAY_PREFIXES=${SKYCODE_SUMMARY_DEEPSEEK_RELAY_PREFIXES:-}
      - LLM_PROVIDER_DEEPSEEK_MODELS=${LLM_PROVIDER_DEEPSEEK_MODELS:-deepseek-flash}
      - LLM_PROVIDER_MOONSHOT_API_KEY=${LLM_PROVIDER_MOONSHOT_API_KEY:-}
      - LLM_PROVIDER_MOONSHOT_MODELS=${LLM_PROVIDER_MOONSHOT_MODELS:-kimi-k3.1-pro-highspeed}
      - LLM_PROVIDER_KIMI_CODE_API_KEY=${LLM_PROVIDER_KIMI_CODE_API_KEY:-}
      - LLM_PROVIDER_KIMI_CODE_MODELS=${LLM_PROVIDER_KIMI_CODE_MODELS:-k3.1-pro-highspeed}
      - LLM_PROVIDER_ZHIPU_API_KEY=${LLM_PROVIDER_ZHIPU_API_KEY:-}
      - LLM_PROVIDER_ZHIPU_MODELS=${LLM_PROVIDER_ZHIPU_MODELS:-glm-5.3}
      - LLM_PROVIDER_MINIMAX_API_KEY=${LLM_PROVIDER_MINIMAX_API_KEY:-}
      - LLM_PROVIDER_MINIMAX_MODELS=${LLM_PROVIDER_MINIMAX_MODELS:-MiniMax-M3}
      - LLM_PROVIDER_HUOSHENAI_API_KEY=${LLM_PROVIDER_HUOSHENAI_API_KEY:-}
      - LLM_PROVIDER_HUOSHENAI_MODELS=${LLM_PROVIDER_HUOSHENAI_MODELS:-gpt-6.2-sol,gpt-6.1-sol,gpt-6-sol,gpt-6.2-astra,gpt-6-astra}
      - LLM_PROVIDER_ZENMUX_API_KEY=${LLM_PROVIDER_ZENMUX_API_KEY:-}
      - LLM_PROVIDER_ZENMUX_MODELS=${LLM_PROVIDER_ZENMUX_MODELS:-anthropic/claude-fable-5.2,anthropic/claude-opus-5.5,anthropic/claude-sonnet-5.5,anthropic/claude-haiku-5.5,openai/gpt-6-astra,google/gemini-4-carbon,x-ai/grok-4.7,meta/muse-wonder-1.0}
      - LLM_PROVIDER_OPENROUTER_API_KEY=${LLM_PROVIDER_OPENROUTER_API_KEY:-}
      - LLM_PROVIDER_OPENROUTER_MODELS=${LLM_PROVIDER_OPENROUTER_MODELS:-openrouter/anthropic/claude-fable-5.2}
      - LLM_FAST_MODEL=${LLM_FAST_MODEL:-deepseek-v4.1-flash}
      - LLM_COMPACT_MODEL=${LLM_COMPACT_MODEL:-deepseek-flash}
      - LLM_COMPACT_LLM_ENABLED=${LLM_COMPACT_LLM_ENABLED:-true}
      - LLM_COMPACT_PROVIDER=${LLM_COMPACT_PROVIDER:-deepseek}
      - LLM_COMPACT_THINKING_MODE=${LLM_COMPACT_THINKING_MODE:-max}
      - LLM_COMPACT_MAX_COMPLETION_TOKENS=${LLM_COMPACT_MAX_COMPLETION_TOKENS:-8192}
      - LLM_COMPACT_MAX_SUMMARY_TOKENS=${LLM_COMPACT_MAX_SUMMARY_TOKENS:-4096}
      - LLM_COMPACT_TIMEOUT_MS=${LLM_COMPACT_TIMEOUT_MS:-90000}
      - LLM_VISION_FALLBACK_MODEL=${LLM_VISION_FALLBACK_MODEL:-deepseek-v4.1-flash}
      # ---- 提示词优化（独立于主会话的旁路模型）----
      # 设置页「场景分派」里给「提示词优化」选了模型的话，优先于这三个变量；都为空则该功能不启用
      - PROMPT_OPTIMIZE_API_KEY=${PROMPT_OPTIMIZE_API_KEY:-}
      - PROMPT_OPTIMIZE_MODEL=${PROMPT_OPTIMIZE_MODEL:-}
      - PROMPT_OPTIMIZE_BASE_URL=${PROMPT_OPTIMIZE_BASE_URL:-}
      - ASR_CORRECTIONS=${ASR_CORRECTIONS:-skycode:sky code,skykode,sky kod,skyco}
      # ---- Legacy Single-Provider (Backward Compatible) ----
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-deepseek-v4.1-flash}
      - LLM_MODELS=${LLM_MODELS:-qwen3.8-max-0902,qwen-turbo,qwen-coder-plus}
      # ---- Web Search ----
      - WEB_SEARCH_BACKEND=${WEB_SEARCH_BACKEND:-auto}
      - WEB_SEARCH_DEEPSEEK_API_KEY=${WEB_SEARCH_DEEPSEEK_API_KEY:-}
      - WEB_SEARCH_DEEPSEEK_BASE_URL=${WEB_SEARCH_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # ---- External MCP servers ----
      - SKYCODE_MCP_SERVERS=${SKYCODE_MCP_SERVERS:-}
      # Delete-session confirmation code (empty = no code required)
      - SKYCODE_DELETE_CONFIRM_CODE=${SKYCODE_DELETE_CONFIRM_CODE:-}
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
      - GITHUB_TOOLS=${GITHUB_TOOLS:-get_me,get_file_contents,search_code,list_branches,list_commits,list_pull_requests,pull_request_read}
      - GITHUB_READ_ONLY=${GITHUB_READ_ONLY:-1}
      - GITHUB_LOCKDOWN_MODE=${GITHUB_LOCKDOWN_MODE:-1}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      - ALIBABA_CLOUD_SECURITY_TOKEN=${ALIBABA_CLOUD_SECURITY_TOKEN:-}
      - ALIBABA_CLOUD_OPS_VISIBLE_TOOLS=${ALIBABA_CLOUD_OPS_VISIBLE_TOOLS:-ECS_DescribeInstances,ECS_DescribeRegions,ECS_DescribeSecurityGroups,OSS_ListBuckets,OSS_ListObjects}
      # ---- Optional (Docker Advanced) — has Dockerfile defaults, override if needed ----
      # Private network access: allows Docker bridge network IPs to bypass auth
      # - ALLOW_PRIVATE_NETWORK=${ALLOW_PRIVATE_NETWORK:-true}
      # Container log directory
      # - LOG_DIR=${LOG_DIR:-/app/log}
      # MCP capability registry path
      # - MCP_REGISTRY_PATH=${MCP_REGISTRY_PATH:-/app/configuration/mcp/mcp_capability_registry.json}
      # Persist user MCP enable/disable choices in the existing data volume.
      - MCP_SERVICE_STATE_PATH=/app/data/mcp-service-states.json
      # Persist backend-wide Skill choices in the same data volume.
      - SKILL_STATE_PATH=/app/data/skill-states.json
      # ---- Internal ----
      - SPRING_WEB_RESOURCES_STATIC_LOCATIONS=classpath:/static/,file:/app/static/
      - SKYCODE_DEFAULT_WORKSPACE=/app/workspace
      - SKYCODE_WORKSPACE_ALLOWED_ROOTS=/app/workspace
      - SKYCODE_GLOBAL_DB_PATH=/app/data/global.db
      - SKYCODE_DATABASE_PROJECT_ROOT=/app/data
      # Python 服务（代码洞察、增强 Git、浏览器自动化、代码质量、变更影响、文件树）由后端拉起并守护。
      # 镜像里装全了，但开关默认是关的，不透传就永远不会启动。
      # WORKSPACE_ROOT：Python 侧解析相对路径的根；不传的话会落到 /app/python-service，路径会锚错。
      - PYTHON_SERVICE_AUTO_START=${PYTHON_SERVICE_AUTO_START:-true}
      - WORKSPACE_ROOT=/app/workspace
      # 注意：.env 里的 PLAYWRIGHT_BROWSERS_PATH 是宿主机路径，不要透传——镜像里浏览器装在 /opt/playwright-browsers（Dockerfile 已设）。
      # 设置页保存的 API Key 用这个密钥加密（Base64 编码的 32 字节随机值）。后端取不到时会临时生成一把，
      # 而临时密钥不在数据卷里，容器重建后就变了，已保存的 Key 全部解不开——所以要显式透传
      - SKYCODE_ENCRYPTION_KEY=${SKYCODE_ENCRYPTION_KEY:-}
      # 协调者模式开关（默认 0，行为不变）
      - SKYCODE_COORDINATOR_MODE=${SKYCODE_COORDINATOR_MODE:-0}
      # ---- Optional Meoo publishing (credentials file is read by the backend only) ----
      - SKYCODE_MEOO_ENABLED=${SKYCODE_MEOO_ENABLED:-false}
      - SKYCODE_MEOO_CREDENTIALS_FILE=${SKYCODE_MEOO_CREDENTIALS_FILE:-/run/secrets/meoo-credentials.json}
      - SKYCODE_MEOO_TIMEOUT_SECONDS=${SKYCODE_MEOO_TIMEOUT_SECONDS:-1200}
      # ---- Optional OSS publishing + clipboard image paste (disabled by default) ----
      # auto prefers local ALIBABA_CLOUD_* credentials, then a named ECS RAM Role.
      - SKYCODE_OSS_ENABLED=${SKYCODE_OSS_ENABLED:-false}
      - SKYCODE_OSS_ENDPOINT=${SKYCODE_OSS_ENDPOINT:-}
      - SKYCODE_OSS_REGION=${SKYCODE_OSS_REGION:-}
      - SKYCODE_OSS_BUCKET=${SKYCODE_OSS_BUCKET:-}
      - SKYCODE_OSS_PUBLIC_BASE_URL=${SKYCODE_OSS_PUBLIC_BASE_URL:-}
      - SKYCODE_OSS_PREVIEW_ENABLED=${SKYCODE_OSS_PREVIEW_ENABLED:-false}
      - SKYCODE_OSS_PREFIX=${SKYCODE_OSS_PREFIX:-skycode-artifacts}
      - SKYCODE_OSS_ECS_ROLE_NAME=${SKYCODE_OSS_ECS_ROLE_NAME:-}
      - SKYCODE_OSS_CREDENTIAL_MODE=${SKYCODE_OSS_CREDENTIAL_MODE:-auto}
      - SKYCODE_OSS_MAX_FILE_BYTES=${SKYCODE_OSS_MAX_FILE_BYTES:-1073741824}
      - SKYCODE_OSS_CONNECT_TIMEOUT_MS=${SKYCODE_OSS_CONNECT_TIMEOUT_MS:-10000}
      - SKYCODE_OSS_REQUEST_TIMEOUT_MS=${SKYCODE_OSS_REQUEST_TIMEOUT_MS:-120000}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      - ALIBABA_CLOUD_SECURITY_TOKEN=${ALIBABA_CLOUD_SECURITY_TOKEN:-}
    volumes:
      # Persistent data (SQLite DB, session data, memories)
      - skycode-data:/app/data
      # Personal memory (MEMORY.md); container HOME is /app, so it lives outside /app/data
      - skycode-memory:/app/.ai-code-assistant
      # User workspace mount (the code project to work on)
      - ${WORKSPACE_PATH:-./workspace}:/app/workspace
      # When enabling Meoo, add a read-only secret mount in a compose override:
      # - /absolute/private/meoo-credentials.json:/run/secrets/meoo-credentials.json:ro
      # Optional: persist logs to host
      # - ./logs:/app/log
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g

volumes:
  skycode-data:
    name: skycode-data
    driver: local
  skycode-memory:
    name: skycode-memory
    driver: local
